
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #172554;
        }

        .subtitle {
            margin: 0;
            color: #64748b;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            width: 300px;
            max-width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(0.94);
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-add {
            background: #16a34a;
            color: white;
            padding: 12px 18px;
        }

        .btn-light {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: #1e3a8a;
            color: white;
        }

        th {
            padding: 16px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        td {
            padding: 15px 16px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #eff6ff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .footer-note {
            padding: 15px 18px;
            color: #64748b;
            font-size: 13px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            h1 {
                font-size: 24px;
            }

            .search-form {
                width: 100%;
            }

            input[type="text"] {
                width: 100%;
                flex: 1;
            }

            .toolbar {
                align-items: stretch;
            }

            .btn-add {
                text-align: center;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="page-header">
        <div>
            <h1>Customer Management</h1>
            <p class="subtitle">
                Manage and organize your registered customers.
            </p>
        </div>

        <a th:href="@{/customers/new}" class="btn btn-add">
            + Add New Customer
        </a>
    </div>

    <div class="toolbar">
        <form th:action="@{/customers/search}"
              method="get"
              class="search-form">

            <input type="text"
                   name="keyword"
                   placeholder="Search by name, phone, or email..."
                   th:value="${keyword}">

            <button type="submit" class="btn btn-primary">
                Search
            </button>

            <a th:href="@{/customers}" class="btn btn-light">
                Clear
            </a>
        </form>
    </div>

    <div class="table-card">
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.id}"></td>
                    <td>
                        <strong th:text="${customer.fullname}"></strong>
                    </td>
                    <td th:text="${customer.address}"></td>
                    <td th:text="${customer.phone}"></td>
                    <td th:text="${customer.email}"></td>

                    <td>
                        <div class="actions">
                            <a th:href="@{/customers/edit/{id}(id=${customer.id})}"
                               class="btn btn-edit">
                                Edit
                            </a>

                            <form th:action="@{/customers/delete/{id}(id=${customer.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this customer?');">

                                <button type="submit"
                                        class="btn btn-delete">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="6" class="empty-message">
                        No customers found. Add a new customer to get started.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="footer-note">
            Customer records
        </div>
    </div>

</div>
</body>
</html>
