
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Form</title>
</head>
<body>

<h1 th:text="${customer.id != null} ?
    'Edit Customer' : 'Register New Customer'">
    Register New Customer
</h1>

<form th:action="${customer.id != null} ?
      @{/customers/update/{id}(id=${customer.id})} :
      @{/customers/save}"
      th:object="${customer}"
      method="post">

    <label for="fullname">Customer Full Name:</label>
    <input type="text" id="fullname"
           th:field="*{fullname}" required>
    <br><br>

    <label for="phone">Phone:</label>
    <input type="text" id="phone"
           th:field="*{phone}" required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email"
           th:field="*{email}" required>
    <br><br>

    <label for="address">Address:</label>
    <input type="text" id="address"
           th:field="*{address}" required>
    <br><br>

    <button type="submit"
            th:text="${customer.id != null} ?
            'Update Customer' : 'Save Customer'">
        Save Customer
    </button>

</form>

<br>
<a th:href="@{/customers}">Back to Customer List</a>

</body>
</html>
