
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Management</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 28px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        h1 { margin: 0 0 7px; font-size: 27px; }
        .subtitle { color: #718096; margin: 0; }

        .button {
            display: inline-block;
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .primary { background: #2563eb; }
        .secondary { background: #64748b; }
        .edit { background: #e0a800; color: #222; }
        .delete { background: #dc3545; }

        .panel {
            background: white;
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-form input {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            border: 1px solid #d6dce5;
            border-radius: 6px;
            font-size: 14px;
        }

        .alert {
            padding: 13px 16px;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .table-wrapper { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            text-align: left;
            padding: 14px 12px;
            border-bottom: 1px solid #edf0f4;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 700;
        }

        tr:hover td { background: #fafcff; }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .actions .button {
            padding: 8px 10px;
            font-size: 12px;
        }

        .actions form { margin: 0; }

        .empty {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            body { padding: 15px; }
            .panel { padding: 14px; }
            .search-form { flex-wrap: wrap; }
            .search-form input { flex-basis: 100%; }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <div>
            <h1>Supplier Management</h1>
            <p class="subtitle">Manage your hardware store suppliers.</p>
        </div>

        <div>
            <a href="/dashboard" class="button secondary">Dashboard</a>
            <a href="/suppliers/new" class="button primary">+ Add Supplier</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}" class="alert error"
         th:text="${errorMessage}"></div>

    <div class="panel">

        <form th:action="@{/suppliers}" method="get" class="search-form">
            <input type="text"
                   name="search"
                   placeholder="Search company, contact, phone or email..."
                   th:value="${search}">

            <button type="submit" class="button primary">Search</button>

            <a th:href="@{/suppliers}" class="button secondary">Clear</a>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Company Name</th>
                    <th>Contact Person</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="supplier : ${suppliers}">
                    <td th:text="${supplier.id}"></td>

                    <td th:text="${supplier.companyName}"></td>

                    <td th:text="${supplier.contactPerson != null
                        ? supplier.contactPerson : '-'}"></td>

                    <td th:text="${supplier.phone}"></td>

                    <td th:text="${supplier.email != null
                        ? supplier.email : '-'}"></td>

                    <td>
                        <span class="status"
                              th:classappend="${supplier.active ? ' active' : ' inactive'}"
                              th:text="${supplier.active ? 'Active' : 'Inactive'}">
                        </span>
                    </td>

                    <td>
                        <div class="actions">

                            <a th:href="@{/suppliers/{id}(id=${supplier.id})}"
                               class="button primary">View</a>

                            <a th:href="@{/suppliers/{id}/edit(id=${supplier.id})}"
                               class="button edit">Edit</a>

                            <form th:action="@{/suppliers/delete/{id}(id=${supplier.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this supplier?');">

                                <button type="submit" class="button delete">
                                    Delete
                                </button>
                            </form>

                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(suppliers)}">
                    <td colspan="7" class="empty">
                        No suppliers found. Add your first supplier.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>
</body>
</html>
