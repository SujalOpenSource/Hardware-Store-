
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid;
            place-items: center; padding: 20px;
            background: #f1f5f9; font-family: Arial, sans-serif;
        }
        .card {
            width: 100%; max-width: 420px; padding: 32px;
            background: white; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }
        h2 { color: #1e293b; }
        p { color: #64748b; line-height: 1.5; }
        label { display: block; margin: 20px 0 7px; font-weight: 600; }
        input {
            width: 100%; padding: 12px;
            border: 1px solid #cbd5e1; border-radius: 7px;
        }
        button {
            width: 100%; margin-top: 20px; padding: 13px;
            border: 0; border-radius: 7px;
            background: #1d4ed8; color: white; cursor: pointer;
        }
        .message { padding: 11px; border-radius: 6px; margin: 12px 0; }
        .error { background: #fee2e2; color: #991b1b; }
        a { display: block; margin-top: 20px; text-align: center; color: #1d4ed8; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Forgot Password?</h2>
    <p>Enter your registered administrator mobile number to request a password-reset OTP.</p>

    <div th:if="${errorMessage}" class="message error"
         th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" th:object="${forgotForm}" method="post">
        <label for="mobileNumber">Mobile Number</label>
        <input type="tel"
               id="mobileNumber"
               th:field="*{mobileNumber}"
               placeholder="98XXXXXXXX"
               required>

        <button type="submit">Send OTP</button>
    </form>

    <a th:href="@{/login}">Back to Login</a>
</div>

</body>
</html>
