
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Sale</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 28px;
            background: #f4f6fa;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 7px;
            font-size: 27px;
        }

        .subtitle {
            color: #64748b;
            margin: 0;
            line-height: 1.5;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 17px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        .back-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .dashboard-btn {
            background: #1e293b;
            color: white;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .dashboard-btn:hover {
            background: #334155;
        }

        .back-btn:hover {
            background: #cbd5e1;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, .05);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            margin: 0 0 20px;
            padding-bottom: 13px;
            border-bottom: 1px solid #e8edf3;
        }

        .form-group {
            margin-bottom: 18px;
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: white;
            color: #1e293b;
            font-family: inherit;
            font-size: 14px;
            min-width: 0;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
        }

        input[readonly] {
            background: #f8fafc;
            color: #475569;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .help-text {
            display: block;
            margin-top: 6px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .walk-in-fields {
            display: none;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 16px;
            padding: 18px;
            margin-top: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .walk-in-fields.visible {
            display: grid;
        }

        .walk-in-fields .form-group:last-child {
            grid-column: 1 / -1;
            margin-bottom: 0;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .product-header .section-title {
            margin: 0;
            padding: 0;
            border: none;
        }

        .add-btn {
            background: #0f766e;
            color: white;
            padding: 10px 14px;
        }

        .add-btn:hover {
            background: #115e59;
        }

        .product-row {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(100px, .8fr)
                                 minmax(120px, 1fr) auto;
            gap: 13px;
            align-items: end;
            padding: 16px;
            margin-bottom: 13px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
        }

        .product-row .form-group {
            margin: 0;
        }

        .remove-btn {
            height: 40px;
            padding: 0 13px;
            border: none;
            border-radius: 7px;
            background: #fee2e2;
            color: #991b1b;
            font-weight: 600;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #fecaca;
        }

        .total-section {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-top: 1px solid #e8edf3;
            margin-top: 18px;
        }

        .total-label {
            font-size: 17px;
            font-weight: 600;
        }

        .total-value {
            font-size: 23px;
            font-weight: 700;
            color: #166534;
        }

        .message {
            padding: 13px 16px;
            border-radius: 7px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .submit-btn {
            background: #2563eb;
            color: white;
            min-width: 150px;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 850px) {
            body {
                padding: 20px;
            }

            .product-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .product-row .remove-btn {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 13px;
            }

            .header {
                align-items: stretch;
            }

            h1 {
                font-size: 23px;
            }

            .header-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .header-actions .btn {
                width: 100%;
            }

            .panel {
                padding: 16px;
            }

            .walk-in-fields {
                grid-template-columns: 1fr;
                padding: 13px;
            }

            .walk-in-fields .form-group:last-child {
                grid-column: auto;
            }

            .product-row {
                grid-template-columns: 1fr;
                padding: 13px;
                gap: 14px;
            }

            .product-header {
                align-items: stretch;
            }

            .add-btn {
                width: 100%;
            }

            .total-section {
                justify-content: space-between;
                gap: 10px;
            }

            .total-value {
                font-size: 20px;
            }

            .form-actions {
                display: grid;
                grid-template-columns: 1fr;
            }

            .form-actions .btn {
                width: 100%;
            }
        }

        @media (max-width: 350px) {
            .header-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <div>
            <h1>Create New Sale</h1>
            <p class="subtitle">
                Select a customer, add products and complete the sale.
            </p>
        </div>

        <div class="header-actions">
            <a th:href="@{/sales}" class="btn back-btn">
                Back to Sales
            </a>

            <a th:href="@{/dashboard}" class="btn dashboard-btn">
                Dashboard
            </a>
        </div>
    </div>

    <div th:if="${errorMessage}"
         class="message error"
         th:text="${errorMessage}">
    </div>

    <form id="saleForm" th:action="@{/sales}" method="post">

        <!-- CUSTOMER INFORMATION -->
        <div class="panel">

            <h2 class="section-title">Customer Information</h2>

            <div class="form-group">
                <label for="customerId">Select Existing Customer</label>

                <select id="customerId" name="customerId">
                    <option value="">Walk-in Customer</option>

                    <option th:each="customer : ${customers}"
                            th:value="${customer.id}"
                            th:text="${customer.name + ' - ' + customer.phone}">
                    </option>
                </select>

                <span class="help-text">
                    Select an existing customer or enter details for a walk-in customer.
                </span>
            </div>

            <div id="walkInFields" class="walk-in-fields">

                <div class="form-group">
                    <label for="walkInName">Customer Name *</label>
                    <input type="text"
                           id="walkInName"
                           name="walkInName"
                           maxlength="150"
                           placeholder="Enter customer name">
                </div>

                <div class="form-group">
                    <label for="walkInPhone">Phone Number</label>
                    <input type="text"
                           id="walkInPhone"
                           name="walkInPhone"
                           maxlength="30"
                           placeholder="Enter phone number">
                </div>

                <div class="form-group">
                    <label for="walkInAddress">Address</label>
                    <input type="text"
                           id="walkInAddress"
                           name="walkInAddress"
                           maxlength="500"
                           placeholder="Enter customer address">
                </div>

            </div>

        </div>

        <!-- PRODUCT INFORMATION -->
        <div class="panel">

            <div class="product-header">
                <h2 class="section-title">Sale Products</h2>

                <button type="button"
                        id="addProductBtn"
                        class="btn add-btn">
                    + Add Product
                </button>
            </div>

            <div id="productRows"></div>

            <template id="productRowTemplate">
                <div class="product-row">

                    <div class="form-group">
                        <label>Product *</label>

                        <select name="productIds"
                                class="product-select"
                                required>

                            <option value="">Select Product</option>

                            <option th:each="product : ${products}"
                                    th:value="${product.id}"
                                    th:attr="data-price=${product.sellingPrice},
                                             data-stock=${product.stockQuantity}"
                                    th:text="${product.name + ' (' + product.sku + ') - Stock: ' + product.stockQuantity}">
                            </option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Quantity *</label>

                        <input type="number"
                               name="quantities"
                               class="quantity-input"
                               min="0.001"
                               step="0.001"
                               value="1"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Unit Price (Rs.)</label>

                        <input type="text"
                               class="unit-price"
                               value="0.00"
                               readonly>
                    </div>

                    <button type="button"
                            class="remove-btn">
                        Remove
                    </button>

                </div>
            </template>

            <div class="total-section">
                <span class="total-label">Grand Total</span>
                <span class="total-value" id="grandTotal">Rs. 0.00</span>
            </div>

        </div>

        <!-- ADDITIONAL INFORMATION -->
        <div class="panel">

            <h2 class="section-title">Additional Information</h2>

            <div class="form-group">
                <label for="notes">Sale Notes</label>

                <textarea id="notes"
                          name="notes"
                          maxlength="500"
                          placeholder="Optional notes about this sale..."></textarea>
            </div>

            <div class="form-actions">

                <a th:href="@{/sales}" class="btn cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="btn submit-btn">
                    Complete Sale
                </button>

            </div>

        </div>

    </form>

</div>

<script th:src="@{/js/sales-create.js}"></script>

</body>
</html>
