<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sales History</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:28px;color:#263238}
        .wrap{max-width:1100px;margin:auto;background:white;padding:26px;border-radius:12px;box-shadow:0 3px 14px #0001}
        h1{margin-top:0}.btn{display:inline-block;padding:10px 14px;border-radius:7px;background:#1769aa;color:white;text-decoration:none}
        table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:12px;border-bottom:1px solid #e4e8ec;text-align:left}
        th{background:#eef3f7} .muted{color:#667}
    </style>
</head>
<body><div class="wrap">
    <h1>Sales Management</h1>
    <p><a class="btn" th:href="@{/com/hardwarestore/sales/new}">+ Record New Sale</a>
       <a class="btn" th:href="@{/reports}">View Reports</a>
       <a class="btn" th:href="@{/customers}">Customers</a></p>
    <p th:if="${successMessage}" th:text="${successMessage}"></p>
    <table>
        <thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Bill</th></tr></thead>
        <tbody>
        <tr th:each="sale : ${sales}">
            <td th:text="${sale.invoiceNumber}"></td>
            <td th:text="${#temporals.format(sale.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${sale.customer.fullname}"></td>
            <td th:text="${sale.items.size()}"></td>
            <td th:text="${'Rs. ' + #numbers.formatDecimal(sale.totalAmount, 1, 2)}"></td>
            <td><a th:href="@{/billing/{id}(id=${sale.id})}">View invoice</a> |
                <a th:href="@{/billing/{id}/pdf(id=${sale.id})}">Download PDF</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(sales)}"><td colspan="6" class="muted">No sales recorded yet.</td></tr>
        </tbody>
    </table>
</div></body></html>
