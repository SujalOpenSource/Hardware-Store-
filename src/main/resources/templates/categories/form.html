
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle} + ' | Hardware Store'">
        Category Form
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 30px auto;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000a;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 27px;
            overflow-wrap: anywhere;
        }

        .muted {
            color: #6b7280;
            margin: 0 0 28px;
            line-height: 1.5;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 9px;
            font-size: 14px;
        }

        input[type="text"],
        textarea {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font: inherit;
            font-size: 14px;
            color: #1f2937;
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.5;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 25px;
            padding: 13px 14px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .checkbox-row input {
            width: 17px;
            height: 17px;
            margin: 0;
            accent-color: #2563eb;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-row label {
            margin: 0;
            cursor: pointer;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 42px;
            padding: 11px 18px;
            border: 0;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: background 0.2s ease;
        }

        .primary {
            background: #1d4ed8;
            color: #ffffff;
        }

        .primary:hover {
            background: #1e40af;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .secondary:hover {
            background: #d1d5db;
        }

        .error {
            padding: 13px 16px;
            margin-bottom: 22px;
            border-radius: 7px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px;
            }

            .container {
                margin: 12px auto;
            }

            .card {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 19px;
                border-radius: 10px;
            }

            h1 {
                font-size: 22px;
            }

            .muted {
                margin-bottom: 23px;
            }

            .buttons {
                flex-direction: column;
            }

            .buttons .btn {
                width: 100%;
            }

            input[type="text"],
            textarea {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1 th:text="${pageTitle}">Add Category</h1>

        <p class="muted">
            Enter the category details below.
        </p>

        <div th:if="${errorMessage}"
             class="error"
             th:text="${errorMessage}">
        </div>

        <form th:action="@{/categories/save}"
              th:object="${category}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label for="name">Category Name *</label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       maxlength="100"
                       placeholder="e.g. Electrical Supplies"
                       required
                       autofocus/>
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <textarea id="description"
                          th:field="*{description}"
                          rows="4"
                          maxlength="500"
                          placeholder="Describe the products in this category"></textarea>
            </div>

            <div class="checkbox-row"
                 th:if="${category.id != null}">

                <input type="checkbox"
                       id="active"
                       th:field="*{active}"/>

                <label for="active">
                    Category is active
                </label>
            </div>

            <div class="buttons">
                <button type="submit" class="btn primary">
                    Save Category
                </button>

                <a th:href="@{/categories}"
                   class="btn secondary">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
