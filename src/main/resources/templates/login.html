
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }
        h1 { margin: 0 0 8px; color: #1e293b; font-size: 25px; }
        .subtitle { color: #64748b; margin-bottom: 28px; }
        label { display: block; margin: 16px 0 7px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 23px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #1e40af; }
        .message {
            padding: 11px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 14px;
        }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #dcfce7; color: #166534; }
        .forgot { display: block; margin-top: 18px; text-align: center; }
        a { color: #1d4ed8; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Hardware Store</h1>
    <p class="subtitle">Administrator Login</p>

    <div th:if="${param.error}" class="message error">
        Invalid mobile number or password.
    </div>

    <div th:if="${param.logout}" class="message success">
        You have successfully logged out.
    </div>

    <div th:if="${resetSuccess}" class="message success"
         th:text="${resetSuccess}"></div>

    <form th:action="@{/login}" method="post">

        <label for="username">Mobile Number</label>
        <input type="tel"
               id="username"
               name="username"
               placeholder="Enter registered mobile number"
               autocomplete="username"
               required>

        <label for="password">Password</label>
        <input type="password"
               id="password"
               name="password"
               placeholder="Enter your password"
               autocomplete="current-password"
               required>

        <button type="submit">Login</button>
    </form>

    <a class="forgot" th:href="@{/forgot-password}">
        Forgot your password?
    </a>
</div>

</body>
</html>
