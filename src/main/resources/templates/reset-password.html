
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid;
            place-items: center; padding: 20px;
            background: #f1f5f9; font-family: Arial, sans-serif;
        }
        .card {
            width: 100%; max-width: 420px; padding: 32px;
            background: white; border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }
        h2 { color: #1e293b; }
        label { display: block; margin: 18px 0 7px; font-weight: 600; }
        input {
            width: 100%; padding: 12px;
            border: 1px solid #cbd5e1; border-radius: 7px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 13px;
            border: 0; border-radius: 7px;
            background: #1d4ed8; color: white; cursor: pointer;
        }
        .error { padding: 11px; background: #fee2e2; color: #991b1b; border-radius: 6px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Create New Password</h2>
    <p>Choose a strong password with at least eight characters.</p>

    <div th:if="${errorMessage}" class="error"
         th:text="${errorMessage}"></div>

    <form th:action="@{/reset-password}" th:object="${resetForm}" method="post">

        <label for="newPassword">New Password</label>
        <input type="password"
               id="newPassword"
               th:field="*{newPassword}"
               minlength="8"
               autocomplete="new-password"
               required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password"
               id="confirmPassword"
               th:field="*{confirmPassword}"
               minlength="8"
               autocomplete="new-password"
               required>

        <button type="submit">Reset Password</button>
    </form>
</div>

</body>
</html>
