
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle} + ' | Hardware Store'">
        Product Form
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f5f9;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 950px;
            margin: 20px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, .06);
        }

        .page-header {
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 27px;
            color: #0f172a;
        }

        .subtitle {
            margin: 0;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 21px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 44px;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: white;
            color: #1f2937;
            font: inherit;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        input[type="file"] {
            padding: 9px;
            background: #f8fafc;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.5;
        }

        .help {
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .checkbox {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox input {
            width: 18px;
            height: 18px;
            min-height: auto;
            accent-color: #2563eb;
        }

        .image-section {
            padding: 16px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
        }

        .image-section p {
            margin: 0 0 12px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        .preview {
            display: block;
            width: 100%;
            max-width: 220px;
            height: 170px;
            object-fit: contain;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            padding: 6px;
        }

        .preview-container {
            margin-top: 15px;
        }

        .message {
            padding: 13px 15px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            min-height: 43px;
            padding: 12px 20px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn:hover {
            filter: brightness(.96);
        }

        .btn:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }

        @media (max-width: 700px) {
            body {
                padding: 13px;
            }

            .container {
                margin: 8px auto;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 23px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 17px;
            }

            .full {
                grid-column: auto;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 9px;
            }

            .card {
                padding: 15px;
                border-radius: 9px;
            }

            h1 {
                font-size: 21px;
            }

            .actions {
                flex-direction: column;
            }

            .actions .btn {
                width: 100%;
            }

            .preview {
                max-width: 100%;
                height: 150px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <header class="page-header">
            <h1 th:text="${pageTitle}">Add Product</h1>
            <p class="subtitle">
                Enter the product information below.
            </p>
        </header>

        <div th:if="${errorMessage}"
             class="message error"
             th:text="${errorMessage}">
            Error message
        </div>

        <form th:action="@{/products/save}"
              th:object="${product}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">

            <div class="grid">

                <div class="field">
                    <label for="name">Product Name *</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           maxlength="150"
                           required
                           placeholder="e.g. Copper Electrical Wire">
                </div>

                <div class="field">
                    <label for="sku">SKU / Product Code *</label>
                    <input id="sku"
                           type="text"
                           th:field="*{sku}"
                           maxlength="50"
                           required
                           placeholder="e.g. WIRE-001">
                </div>

                <div class="field full">
                    <label for="categoryId">Category *</label>

                    <select id="categoryId"
                            name="categoryId"
                            required>

                        <option value="">Select a category</option>

                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"
                                th:selected="${product.category != null
                                    and product.category.id != null
                                    and product.category.id == category.id}">
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label for="purchasePrice">Purchase Price (NPR) *</label>
                    <input id="purchasePrice"
                           type="number"
                           th:field="*{purchasePrice}"
                           min="0"
                           step="0.01"
                           required>
                </div>

                <div class="field">
                    <label for="sellingPrice">Selling Price (NPR) *</label>
                    <input id="sellingPrice"
                           type="number"
                           th:field="*{sellingPrice}"
                           min="0"
                           step="0.01"
                           required>
                </div>

                <div class="field">
                    <label for="stockQuantity">Current Stock *</label>
                    <input id="stockQuantity"
                           type="number"
                           th:field="*{stockQuantity}"
                           min="0"
                           step="0.001"
                           required>
                    <span class="help">
                        Fractional quantities are supported.
                    </span>
                </div>

                <div class="field">
                    <label for="minimumStock">Minimum Stock Alert *</label>
                    <input id="minimumStock"
                           type="number"
                           th:field="*{minimumStock}"
                           min="0"
                           step="0.001"
                           required>
                </div>

                <div class="field full">
                    <label for="description">Description</label>
                    <textarea id="description"
                              th:field="*{description}"
                              maxlength="1000"
                              placeholder="Product details, size, brand, material, etc."></textarea>
                </div>

                <div class="field full">
                    <label for="imageFile">Product Image</label>

                    <div class="image-section">
                        <input id="imageFile"
                               type="file"
                               name="imageFile"
                               accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">

                        <p class="help">
                            JPG, JPEG, PNG or WebP. Maximum size: 5 MB.
                            Leave empty to keep the current image when editing.
                        </p>

                        <div th:if="${product.imagePath != null
                                     and !product.imagePath.isBlank()}">

                            <p>Current image:</p>

                            <img class="preview"
                                 th:src="${product.imagePath}"
                                 th:alt="${product.name}">
                        </div>

                        <div id="newImagePreviewContainer"
                             class="preview-container"
                             hidden>

                            <p>Selected image preview:</p>

                            <img id="newImagePreview"
                                 class="preview"
                                 alt="Selected product image">
                        </div>
                    </div>
                </div>

                <div class="field full">
                    <label class="checkbox" for="active">
                        <input type="checkbox" th:field="*{active}">
                        Product is active
                    </label>
                </div>

            </div>

            <div class="actions">
                <button type="submit" class="btn primary">
                    Save Product
                </button>

                <a th:href="@{/products}" class="btn secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>

<script th:src="@{/js/product-form.js}" defer></script>

</body>
</html>
